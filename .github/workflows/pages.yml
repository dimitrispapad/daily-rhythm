name: Build and publish

# Checks plan.js, builds Daily-Rhythm.ics, and publishes the site to the gh-pages branch.
# GitHub Pages serves that branch at https://dimitrispapad.github.io/daily-rhythm/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check the plan and build the calendar
        run: node scripts/build.js
      - name: Collect the site
        run: |
          mkdir _site
          cp -r index.html styles.css plan.js app.js sw.js manifest.webmanifest Daily-Rhythm.ics icons _site/
          touch _site/.nojekyll
      - name: Publish to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
