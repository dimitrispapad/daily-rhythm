name: Build and publish

# Checks plan.js, builds Daily-Rhythm.ics, reads the iCloud calendar (encrypted),
# and publishes the site to the gh-pages branch, which GitHub Pages serves at
# https://dimitrispapad.github.io/daily-rhythm/
# Runs on every change to main, and every 15 minutes to pick up new calendar events.

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check the plan and build the calendar
        run: node scripts/build.js
      - name: Collect the site
        run: |
          mkdir _site
          cp -r index.html styles.css plan.js app.js sw.js manifest.webmanifest Daily-Rhythm.ics icons _site/
          touch _site/.nojekyll
      - name: Read the iCloud calendar
        id: cal
        env:
          ICLOUD_CALENDAR_URLS: ${{ secrets.ICLOUD_CALENDAR_URLS }}
          CAL_PASSPHRASE: ${{ secrets.CAL_PASSPHRASE }}
        run: node scripts/sync-calendar.js
      - name: Publish to gh-pages
        if: github.event_name != 'schedule' || steps.cal.outputs.changed == 'true'
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7} (${{ github.event_name }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
