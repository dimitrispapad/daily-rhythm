<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dimitris Daily Rhythm</title>
<meta name="description" content="My hour-by-hour week: what to eat, when to train, work, stop, see friends and write, with goals and an Apple Calendar feed.">
<meta name="theme-color" content="#F3F6FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1035" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rhythm">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&family=Noto+Serif+Display:ital,wght@0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header>
    <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 4 L37 35 H3 Z" fill="none" stroke="var(--brand)" stroke-width="3" stroke-linejoin="round"/><circle cx="20" cy="25" r="4.2" fill="var(--now)"/></svg>
    <div class="hd-text">
      <h1>Dimitris · Daily Rhythm</h1>
      <span class="date" id="hdDate"></span>
    </div>
  </header>

  <p class="question" id="question"></p>

  <section class="now" id="nowCard" aria-live="polite"></section>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" id="tab-today" data-tab="today" aria-selected="true">Today</button>
    <button role="tab" id="tab-week" data-tab="week" aria-selected="false">Week</button>
    <button role="tab" id="tab-food" data-tab="food" aria-selected="false">Food</button>
    <button role="tab" id="tab-goals" data-tab="goals" aria-selected="false">Goals</button>
    <button role="tab" id="tab-setup" data-tab="setup" aria-selected="false">Setup</button>
  </nav>

  <main id="panel"></main>
  <div class="sync" id="sync">Progress saved on this device</div>
</div>
<div class="toast" id="toast" hidden></div>
<noscript><p style="padding:16px">Daily Rhythm needs JavaScript turned on.</p></noscript>
<script src="plan.js"></script>
<script src="app.js"></script>
</body>
</html>
